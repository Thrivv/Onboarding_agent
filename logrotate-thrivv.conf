# logrotate-thrivv.conf
#
# Nginx writes its access/error logs directly to files under /var/log/nginx
# (see nginx-combined.conf's implicit default access_log/error_log — nothing
# there ever pointed them at stdout, unlike the backend and nginx PROCESS
# output, which supervisord already sends to /dev/stdout/stderr and Docker's
# own json-file driver rotates — see docker-compose.yml's `logging:` block).
#
# Those files are bind-mounted to the host (./logs/nginx:/var/log/nginx) and
# nothing was ever rotating them, so they grew without bound — observed at
# 200MB+ on a single access.log with no compaction. This file, run
# periodically by the `logrotate` program in supervisord.conf, fixes that for
# every log directory the app writes into.
#
# `copytruncate` is used throughout rather than the default
# rotate-then-signal approach: several of these directories are written to by
# processes (nginx, and potentially direct file handlers in the Python
# logging config) that this config has no reliable way to signal to reopen
# their file descriptor, and copytruncate works regardless — it copies the
# current content out, then truncates the original file in place, so the
# writer keeps writing to the same (now-empty) file without needing to know
# rotation happened.

/var/log/nginx/*.log
/var/log/backend/*.log
/var/log/frontend/*.log
/var/log/reply-loop/*.log
/var/log/supervisor/*.log
{
    daily
    rotate 7
    size 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
