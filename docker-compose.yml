services:
  # Combined: Backend (7000) + Frontend + Nginx (9000)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=/onboarding/ai/api
    image: thrivvdevaccount/thrivv_onboarding_langraph:latest
    container_name: OnboardLG-app
    ports:
      - "9000:9000"
      - "7000:7000"
    env_file:
      - .env.docker
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - DOCUMENTS_PATH=/app/backend/documents/sme
      - EXTERNAL_FILE_PATH=
    volumes:
      - ./backend/documents:/app/backend/documents
      - ./backend/summary:/app/backend/summary
      - ./logs/backend:/var/log/backend
      - ./logs/nginx:/var/log/nginx
      - ./logs/supervisor:/var/log/supervisor
      - ./logs/frontend:/var/log/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  reply-loop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=/onboarding/ai/api
    image: thrivvdevaccount/thrivv_onboarding_langraph:latest
    container_name: OnboardLG-reply-loop
    env_file:
      - .env.docker
    environment:
      - PYTHONUNBUFFERED=1
      - DOCUMENTS_PATH=/app/backend/documents/sme
      - EXTERNAL_FILE_PATH=/app/external_documents
      - PYTHONPATH=/app
    volumes:
      - ./backend/documents:/app/backend/documents
      - ./backend/summary:/app/backend/summary
      - ./logs/reply-loop:/var/log/reply-loop
    working_dir: /app 
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.services.reply_loop"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
