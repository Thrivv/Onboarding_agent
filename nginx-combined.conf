events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 9000;
        server_name demo.growx.global;

        root /usr/share/nginx/html;
        index index.html;

        # Allow large document uploads through the proxy
        client_max_body_size 100m;

        # Root → app base path
        location = / {
            return 302 /onboarding/ai/;
        }

        # Backend API — everything under /onboarding/ai/api/* is passed to
        # FastAPI unchanged (backend serves routes with this same prefix)
        location /onboarding/ai/api/ {
            proxy_pass http://127.0.0.1:7000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Frontend (React SPA under /onboarding/ai)
        location /onboarding/ai {
            try_files $uri $uri/ /onboarding/ai/index.html;
        }

        # Legacy paths → new base path (e.g. /onboarding/signup → /onboarding/ai/signup)
        location = /onboarding {
            return 302 /onboarding/ai/;
        }
        location = /onboarding/ {
            return 302 /onboarding/ai/;
        }

        # Verification progress redirect target — must stay at /onboarding/verificationProgress,
        # not be bounced to /onboarding/ai/verificationProgress like other legacy paths.
        location = /onboarding/verificationProgress {
            alias /usr/share/nginx/html/onboarding/ai/index.html;
        }

        location /onboarding/ {
            rewrite ^/onboarding/(.*)$ /onboarding/ai/$1 redirect;
        }

        # Health check
        location /health {
            proxy_pass http://127.0.0.1:7000/health;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
