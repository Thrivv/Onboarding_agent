[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
pidfile=/var/run/supervisord.pid

[program:backend]
; --workers reads UVICORN_WORKERS from .env.docker. Currently 1, deliberately.
;
; More than one worker means more than one PROCESS, each with its own memory.
; One thing in this app holds state in process memory and therefore breaks when
; workers > 1:
;   * email_otp_service._otp_store  — OTPs are cached in a plain dict, so a
;     verify request routed to the other worker sees no OTP at all.
; (This list previously also named message_cache.MessageCache. That module was
; never imported by anything and was removed in the Stage A cleanup, so it is
; no longer a constraint — the OTP store alone still is.)
; Multiple workers also duplicate the lifespan block, so the startup logs and
; the hourly session-cleanup task each run once per worker.
;
; The tradeoff: with 1 worker a synchronous LLM call blocks the event loop for
; its whole duration (OTP email ~10s, signup ~10s observed). Before raising
; this above 1, move the OTP + message caches to Supabase or Redis, otherwise
; OTP verification starts failing for roughly (workers-1)/workers of requests.
command=uvicorn app.main:app --host 0.0.0.0 --port 7000 --workers %(ENV_UVICORN_WORKERS)s
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:logrotate]
; Rotates the log FILES written directly by nginx (and the other mounted
; /var/log/* directories) — see logrotate-thrivv.conf for why these needed
; their own rotation on top of Docker's own json-file driver, which only
; covers stdout/stderr from the two programs above.
command=/usr/local/bin/logrotate-loop.sh
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
